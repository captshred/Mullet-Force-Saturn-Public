name: Playable Saturn build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: saturn-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  MF_PRESERVE_AUDIO: '1'
jobs:
  playable:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MF_PUNCH_COMBO: '1'
      MF_FAST_RUNNING_BAT: '1'
      MF_PLAYER_RUN_WAIST: '1'
      MF_CHUCK_DENIM_CLEANUP: '1'
      MF_PLAYER_DEATH: '1'
      MF_PLAYER_HURT: '1'
      MF_CP_HQ_COMBAT: '1'
      MF_HQ_JUMP: '1'
      MF_HQ_TORCH: '1'
      MF_JAB_COHESION: '1'
      MF_ATTACK_SEQUENCE: '1'
      MF_BAT_MOMENTUM: '1'
      MF_COMBAT_ANIMATION: '1'
      MF_RUNNING_BAT_VISUALS: '1'
      MF_RUN_BAT: '1'
      MF_DASH_ENABLED: '1'
      MF_DASH_PRESET: 'B'
      MF_CORPORATE_LIGHTING: '1'
      MF_CORPORATE_REFINED: '1'
      MF_CORPORATE_PUNK: '1'
      MF_WALK_KNEE_LIFT: '1'
      MF_ORIGINAL_THREE_WALK: '1'
      MF_ORIGINAL_WALK_SLOW: '1'
      MF_PLAYABLE_ANIMATION: '1'
      MF_ANIMATION_PREVIEW: '1'
      MF_SPRITE_GALLERY: '1'
      MF_VDP2_STREET: '1'
      MF_PARALLAX_DEMO: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build selected jab-jab-cross profile
        run: make
      - name: Check runtime assets and disc
        run: make check
      - name: Run gameplay and rendering regressions
        run: make test
      - name: Package playable files and checksums
        run: |
          mkdir -p build/download
          cp build/mullet-force.bin build/mullet-force.cue build/BUILD-INFO.txt build/download/
          cp docs/JO-ENGINE-LICENSE.txt third_party/mid2seq/LICENSE build/download/
          (cd build/download && sha256sum mullet-force.bin mullet-force.cue > SHA256SUMS.txt)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mullet-force-playable-${{ github.sha }}
          path: build/download/
          retention-days: 1
          if-no-files-found: error
