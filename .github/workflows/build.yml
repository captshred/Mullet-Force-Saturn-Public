name: Approved bat-fix Saturn build

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  APPROVED_COMMIT: b1abb866aa0f6cfd09794a0ed76e5f054a6ecf6f
  MF_PRESERVE_AUDIO: '1'

jobs:
  playable:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact approved bat-fix source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: captshred/Mullet-Force-Saturn-Public
          ref: ${{ env.APPROVED_COMMIT }}
          persist-credentials: false
      - name: Verify source identity
        run: test "$(git rev-parse HEAD)" = "$APPROVED_COMMIT"
      - name: Install host dependencies and pinned SDK
        # Includes genisoimage; setup.sh preserves the approved Jo Engine pin.
        run: bash tools/bootstrap.sh
      - name: Build approved punch-combo and fast-running-bat profile
        run: bash tools/build-punch-combo.sh --native
      - name: Validate disc, runtime assets and gameplay regressions
        run: |
          make check
          make test
          grep -Fx "Commit: $APPROVED_COMMIT" build/BUILD-INFO.txt
      - name: Package matching playable files and checksums
        run: |
          mkdir -p build/download
          cp build/mullet-force.bin build/mullet-force.cue build/BUILD-INFO.txt build/download/
          cp docs/JO-ENGINE-LICENSE.txt build/download/
          cp third_party/mid2seq/LICENSE build/download/MID2SEQ-LICENSE.txt
          cd build/download
          sha256sum mullet-force.bin mullet-force.cue BUILD-INFO.txt JO-ENGINE-LICENSE.txt MID2SEQ-LICENSE.txt > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Upload playable BIN/CUE artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mullet-force-bat-fix-${{ env.APPROVED_COMMIT }}
          path: build/download/
          retention-days: 1
          if-no-files-found: error
